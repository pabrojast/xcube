# ==============================================================================
# Kubernetes Deployment for Ukraine LWQ xcube Service
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xcube-ukraine
  namespace: xcube-ukraine
  labels:
    app: xcube-ukraine
    version: v1
spec:
  replicas: 1  # Start with 2 replicas for high availability
  selector:
    matchLabels:
      app: xcube-ukraine
  template:
    metadata:
      labels:
        app: xcube-ukraine
        version: v1
    spec:
      containers:
      - name: xcube-ukraine
        # Docker image from Docker Hub
        # Build: docker build -f Dockerfile.ukraine -t pabrojast/xcube:ukrainetest .
        # Push: docker push pabrojast/xcube:ukrainetest
        image: pabrojast/xcube:ukrainetest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        env:
        # Azure Storage credentials from Secret
        - name: AZURE_STORAGE_ACCOUNT_NAME
          valueFrom:
            secretKeyRef:
              name: azure-storage-credentials
              key: account-name
        
        - name: AZURE_STORAGE_ACCOUNT_KEY
          valueFrom:
            secretKeyRef:
              name: azure-storage-credentials
              key: account-key
        
        - name: AZURE_STORAGE_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: azure-storage-credentials
              key: connection-string
        
        # xcube configuration
        - name: XCUBE_LOG_LEVEL
          value: "INFO"
        
        # Command override to use /xcube prefix
        command:
          - /usr/local/bin/_entrypoint.sh
          - xcube
          - serve
          - --config
          - /config/xcube_ukraine_config.yml
          - --address
          - "0.0.0.0"
          - --port
          - "8080"
          - --prefix
          - "/xcube"
          - --verbose
        
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        
        # Resource limits and requests
        resources:
          requests:
            memory: "3Gi"
            cpu: "250m"
          limits:
            memory: "6Gi"
            cpu: "1000m"
        
        # Liveness probe - checks if container is alive
        livenessProbe:
          httpGet:
            path: /xcube/datasets
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        # Readiness probe - checks if container is ready to serve traffic
        readinessProbe:
          httpGet:
            path: /xcube/datasets
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Startup probe - for slow-starting containers
        startupProbe:
          httpGet:
            path: /xcube/datasets
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12  # 120 seconds total
      
      volumes:
      - name: config
        configMap:
          name: xcube-ukraine-config
      
      # Recommended: Add node affinity for better distribution
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - xcube-ukraine
              topologyKey: kubernetes.io/hostname

---
# ==============================================================================
# Horizontal Pod Autoscaler
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: xcube-ukraine-hpa
  namespace: xcube-ukraine
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: xcube-ukraine
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
