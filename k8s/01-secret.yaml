# ==============================================================================
# Kubernetes Secret for Azure Storage Credentials
# ==============================================================================
# Note: In production, use sealed-secrets, external-secrets, or vault
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-credentials
  namespace: xcube-ukraine
type: Opaque
stringData:
  account-name: "ihpwinsdata"
  account-key: "<AZURE_STORAGE_ACCOUNT_KEY>"
  connection-string: "DefaultEndpointsProtocol=https;AccountName=ihpwinsdata;AccountKey=<AZURE_STORAGE_ACCOUNT_KEY>;EndpointSuffix=core.windows.net"
