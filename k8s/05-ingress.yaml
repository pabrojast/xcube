# ==============================================================================
# Kubernetes Ingress with NGINX - Production Configuration
# ==============================================================================
# This Ingress configures NGINX to route traffic to /xcube/* to the xcube service
# Configured for data.dev-wins.com with TLS support
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xcube-ukraine-ingress
  namespace: xcube-ukraine
  annotations:
    # Let's Encrypt certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    
    # Proxy body size and buffer settings (aligned with your CKAN config)
    nginx.ingress.kubernetes.io/client-body-buffer-size: 500M
    nginx.ingress.kubernetes.io/proxy-body-size: 500M
    
    # Proxy timeout settings (aligned with your CKAN config)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    
    # Regex support for path rewriting
    #nginx.ingress.kubernetes.io/use-regex: "true"
    
    # Disable proxy buffering for streaming responses
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    
    # Rewrite rules for /xcube prefix
    #nginx.ingress.kubernetes.io/rewrite-target: /$2
    
    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    
    # SSL/TLS redirect
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # CRITICAL: Forward protocol headers so xcube knows it's behind HTTPS
    # This fixes the "Mixed Content" error with openapi.json
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    
    # Additional headers to ensure HTTPS URLs are generated
    nginx.ingress.kubernetes.io/proxy-redirect-from: "~^http://([^/]+)/(.*)$"
    nginx.ingress.kubernetes.io/proxy-redirect-to: "https://$1/$2"

spec:
  # Use the same ingressClassName as your CKAN setup
  ingressClassName: nginx
  
  # TLS configuration with Let's Encrypt
  tls:
    - hosts:
      - data.dev-wins.com
      secretName: xcube-ukraine-tls
  
  rules:
  # Production rule with hostname
  - host: "data.dev-wins.com"
    http:
      paths:
      - path: "/xcube(/|$)(.*)"
        pathType: ImplementationSpecific
        backend:
          service:
            name: xcube-ukraine-service
            port:
              number: 80

---
